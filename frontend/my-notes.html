<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Notes</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .button {
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            color: white;
            background: #4f46e5;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .upload-button {
            background: #16a34a;
        }

        .note-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .note-card h2 {
            margin-top: 0;
            color: #222;
        }

        .note-card p {
            color: #555;
            margin: 8px 0;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .view-button {
            background: #2563eb;
        }

        .edit-button {
            background: #f59e0b;
        }

        .delete-button {
            background: #dc2626;
        }

        .message {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        /* EDIT FORM */

        #editFormContainer {
            display: none;
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        #editFormContainer h2 {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        label {
            font-weight: bold;
        }

        .save-button {
            background: #16a34a;
        }

        .cancel-button {
            background: #6b7280;
        }

    </style>

</head>


<body>


<header>

    <h1>📚 My Uploaded Notes</h1>

</header>


<div class="container">


    <!-- TOP BUTTONS -->

    <div class="top-buttons">

        <a
            href="index.html"
            class="button"
        >
            ← All Notes
        </a>


        <a
            href="upload.html"
            class="button upload-button"
        >
            📤 Upload Note
        </a>

    </div>



    <!-- EDIT FORM -->

    <div id="editFormContainer">

        <h2>✏️ Edit Note</h2>


        <form id="editForm">

            <label>
                Title
            </label>

            <input
                type="text"
                id="editTitle"
                required
            >


            <label>
                Subject
            </label>

            <input
                type="text"
                id="editSubject"
                required
            >


            <label>
                Topic
            </label>

            <input
                type="text"
                id="editTopic"
            >


            <label>
                Description
            </label>

            <textarea
                id="editDescription"
            ></textarea>


            <button
                type="submit"
                class="button save-button"
            >
                💾 Save Changes
            </button>


            <button
                type="button"
                class="button cancel-button"
                onclick="cancelEdit()"
            >
                Cancel
            </button>

        </form>

    </div>



    <!-- NOTES -->

    <div id="notesContainer">

        <p>Loading notes...</p>

    </div>


</div>



<script>


const userId = localStorage.getItem("user_id");


// =====================================
// CHECK LOGIN
// =====================================

if (!userId) {

    alert("Please login first.");

    window.location.href = "login.html";

}


// =====================================
// LOAD MY NOTES
// =====================================

async function loadMyNotes() {

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/my-notes/" + userId
        );


        const notes = await response.json();


        const container =
            document.getElementById("notesContainer");


        container.innerHTML = "";


        // NO NOTES

        if (notes.length === 0) {

            container.innerHTML = `

                <div class="message">

                    <h2>No Notes Uploaded Yet</h2>

                    <p>
                        You haven't uploaded any notes.
                    </p>

                    <a
                        href="upload.html"
                        class="button upload-button"
                    >
                        📤 Upload Your First Note
                    </a>

                </div>

            `;

            return;

        }


        // DISPLAY NOTES

        notes.forEach(note => {

            const card =
                document.createElement("div");


            card.className = "note-card";


            card.innerHTML = `

                <h2>
                    ${note.title}
                </h2>


                <p>
                    <strong>Subject:</strong>
                    ${note.subject}
                </p>


                <p>
                    <strong>Topic:</strong>
                    ${note.topic || "Not specified"}
                </p>


                <p>
                    <strong>Description:</strong>
                    ${note.description || "No description"}
                </p>


                <p>
                    👁️ Views:
                    ${note.views}
                </p>


                <div class="actions">

                    <a
                        href="note.html?id=${note.id}"
                        class="button view-button"
                    >
                        📖 View Note
                    </a>


                    <button
                        class="button edit-button"
                        onclick="editNote(${note.id})"
                    >
                        ✏️ Edit
                    </button>


                    <button
                        class="button delete-button"
                        onclick="deleteNote(${note.id})"
                    >
                        🗑️ Delete
                    </button>

                </div>

            `;


            container.appendChild(card);

        });

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "notesContainer"
        ).innerHTML = `

            <div class="message">

                <h2>Something went wrong</h2>

                <p>
                    Could not load your notes.
                </p>

            </div>

        `;

    }

}



// =====================================
// EDIT NOTE
// =====================================

async function editNote(noteId) {

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/notes"
        );


        const notes = await response.json();


        const note = notes.find(
            n => n.id === noteId
        );


        if (!note) {

            alert("Note not found.");

            return;

        }


        document.getElementById(
            "editTitle"
        ).value = note.title;


        document.getElementById(
            "editSubject"
        ).value = note.subject;


        document.getElementById(
            "editTopic"
        ).value = note.topic || "";


        document.getElementById(
            "editDescription"
        ).value = note.description || "";


        document.getElementById(
            "editFormContainer"
        ).style.display = "block";


        document.getElementById(
            "editFormContainer"
        ).scrollIntoView({
            behavior: "smooth"
        });


        document.getElementById(
            "editForm"
        ).dataset.noteId = noteId;

    }

    catch (error) {

        console.error(error);

        alert("Could not load note.");

    }

}



// =====================================
// SAVE EDITED NOTE
// =====================================

document.getElementById(
    "editForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const noteId =
            this.dataset.noteId;


        const formData =
            new FormData();


        formData.append(
            "title",
            document.getElementById(
                "editTitle"
            ).value
        );


        formData.append(
            "subject",
            document.getElementById(
                "editSubject"
            ).value
        );


        formData.append(
            "topic",
            document.getElementById(
                "editTopic"
            ).value
        );


        formData.append(
            "description",
            document.getElementById(
                "editDescription"
            ).value
        );


        formData.append(
            "user_id",
            userId
        );


        try {

            const response = await fetch(

                "http://127.0.0.1:8000/edit-note/"
                + noteId,

                {
                    method: "PUT",

                    body: formData

                }

            );


            const result =
                await response.json();


            if (
                result.message ===
                "Note updated successfully"
            ) {

                alert(
                    "Note updated successfully!"
                );


                cancelEdit();


                loadMyNotes();

            }

            else {

                alert(
                    result.message
                );

            }

        }

        catch (error) {

            console.error(error);

            alert(
                "Could not update note."
            );

        }

    }
);



// =====================================
// CANCEL EDIT
// =====================================

function cancelEdit() {

    document.getElementById(
        "editFormContainer"
    ).style.display = "none";

}



// =====================================
// DELETE NOTE
// =====================================

async function deleteNote(noteId) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this note?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response = await fetch(

            "http://127.0.0.1:8000/delete-note/"
            + noteId
            + "/"
            + userId,

            {
                method: "DELETE"
            }

        );


        const result =
            await response.json();


        if (
            result.message ===
            "Note deleted successfully"
        ) {

            alert(
                "Note deleted successfully!"
            );


            loadMyNotes();

        }

        else {

            alert(
                result.message
            );

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not delete note."
        );

    }

}



// =====================================
// LOAD NOTES
// =====================================

loadMyNotes();


</script>


</body>

</html>
